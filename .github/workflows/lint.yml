#what is your goal of your workflow
#Goal: Whenver someone changes the pyhton code, the liner will check if the syntax, format, indentation(Linting) is correct or not
name: Auto Linter

on:
  push:
    paths: "*.py"

jobs:
  code-linting:  
    runs-on: ubuntu-latest
    steps:  
          # This step will automatically clone the code of the currrent branch into the runner 
        - name: Checkout/Clone the code
          uses: actions/checkout@v7
          # this step will install the linting tool-ruff
        - name: Install Linter
          run: pip install ruff
          # this step will run the linter
        - name: Check the files for linting
          run: ruff check .
