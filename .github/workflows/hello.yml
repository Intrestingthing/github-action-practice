#Workflow-Main
name: Hello

#On tells when the workflow run
on: 
  workflow_dispatch:

#Jobs- it should be inside the workflows
#Jobs tells what the workflow should do, there can be one or more than one jobs,hence we write Jobs
# jobs is an object so needs indentation

jobs:
# 1st Job(give indentation)
  say-hello:
    # Creates on Ephermal Continar with Ubantu running. Ephermal Continar:- It will run this job in continar for a short time then automatically delete it
    runs-on: ubantu-lastest
    #that ephermal container will have steps to execute, hence name those steps and use run: run have the command.
    steps:
      - name: say hello to everyone
        run: echo "Hello Devops"
  
#Steps- it should be inside the jobs
#Actions- it should be inside the steps

